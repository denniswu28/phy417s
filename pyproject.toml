[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "galaxy-structure"
version = "0.1.0"
description = "Deterministic, synthetic-only 21 cm spectrum analysis demonstration."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Dennis Wu" }]
keywords = ["synthetic", "spectrum", "radio-astronomy", "reproducibility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=2.0",
  "astropy>=7.0",
  "matplotlib>=3.9",
]

[project.urls]
Repository = "https://github.com/denniswu28/phy417s"

[project.scripts]
galaxy-structure = "galaxy_structure.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
galaxy_structure = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PTH", "C4", "ARG"]

[tool.ruff.lint.per-file-ignores]
# The unavailable stages keep their intended signatures so callers see the real
# API shape; the arguments are deliberately unused because the stage fails closed.
"src/galaxy_structure/unavailable.py" = ["ARG001"]
"tests/*" = ["ARG001"]
